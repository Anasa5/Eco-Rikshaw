<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missions | Eco Rikshaw</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #faf8f2;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      padding: 16px 16px 80px;
      color: #2d241a;
    }

    /* ─── Aura Background ─── */
    .aura-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aura-layer-1,
    .aura-layer-2 {
      position: absolute;
      inset: 0;
      transform: translateZ(0);
      will-change: transform;
      pointer-events: none;
    }
    .aura-layer-1 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.12) 28%, rgb(255,255,255) 18%, rgb(255,138,61) 68%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(125px);
    }
    .aura-layer-2 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.22) 34%, rgb(255,255,255) 66%, rgb(255,138,61) 82%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(100px);
    }
    @media (min-width: 768px) {
      .aura-layer-1 { filter: blur(180px); }
      .aura-layer-2 { filter: blur(144px); }
    }

    /* ─── Content Wrapper ─── */
    .content-wrapper {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ─── Header ─── */
    .header {
      background: rgba(255, 252, 248, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 180, 0.30);
      box-shadow: 0 4px 16px rgba(160, 120, 80, 0.06);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .header:hover {
      border-color: rgba(200, 150, 100, 0.45);
      box-shadow: 0 6px 24px rgba(160, 120, 80, 0.10);
    }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #7a4f2b;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 i {
      color: #b8702a;
    }
    .header-icons {
      display: flex;
      gap: 14px;
      color: #7a6555;
      font-size: 1.2rem;
    }
    .header-icons i {
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
    }
    .header-icons i:hover {
      color: #b8702a;
      transform: scale(1.1);
    }

    /* ─── Balance Card ─── */
    .balance-card {
      background: linear-gradient(145deg, #d48e45, #b8702a);
      border-radius: 16px;
      padding: 18px 20px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 20px rgba(184, 112, 42, 0.20);
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease forwards;
    }
    .balance-info h2 {
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0.9;
      margin: 0 0 4px;
    }
    .balance-amount {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0;
    }
    .balance-icon {
      background: rgba(255,255,255,0.2);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    /* ─── Missions Header ─── */
    .missions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .missions-header .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #7a4f2b;
      margin: 0;
    }
    .missions-header .progress-text {
      font-size: 0.8rem;
      color: #7a6555;
      font-weight: 500;
    }

    /* ─── Task Card ─── */
    .task {
      background: rgba(255, 252, 248, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 16px;
      border: 1px solid rgba(255, 215, 180, 0.25);
      box-shadow: 0 4px 12px rgba(160, 120, 80, 0.06);
      padding: 18px;
      margin-bottom: 14px;
      transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
      position: relative;
      overflow: hidden;
    }
    .task:nth-child(2) { animation-delay: 0.08s; }
    .task:nth-child(3) { animation-delay: 0.16s; }
    .task:nth-child(4) { animation-delay: 0.24s; }
    .task:nth-child(5) { animation-delay: 0.32s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task:hover {
      transform: translateY(-4px);
      border-color: rgba(200, 150, 100, 0.45);
      box-shadow: 0 10px 30px rgba(160, 120, 80, 0.10), 0 0 0 1px rgba(200, 150, 100, 0.15) inset;
    }

    .task.claimed {
      border-left: 4px solid #7a9f5a;
    }
    .task.pending {
      border-left: 4px solid #b8702a;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .task-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1rem;
      color: #2d241a;
    }
    .task-icon {
      width: 32px;
      height: 32px;
      background: rgba(184, 112, 42, 0.10);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b8702a;
      font-size: 0.9rem;
    }
    .task-reward {
      background: linear-gradient(145deg, #d48e45, #b8702a);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(184, 112, 42, 0.15);
    }
    .task-description {
      font-size: 0.85rem;
      color: #7a6555;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .task-progress {
      width: 100%;
      height: 6px;
      background: rgba(200, 180, 160, 0.2);
      border-radius: 3px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #d48e45, #b8702a);
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .task-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-status {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(200, 180, 160, 0.15);
      color: #7a6555;
    }
    .task-status.completed {
      background: rgba(122, 159, 90, 0.15);
      color: #5f8a3a;
    }
    .task-status.pending {
      background: rgba(184, 112, 42, 0.10);
      color: #b8702a;
    }

    .claim-btn {
      background: linear-gradient(145deg, #d48e45, #b8702a);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(184, 112, 42, 0.15);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .claim-btn:disabled {
      background: rgba(200, 180, 160, 0.25);
      color: #b8a898;
      cursor: not-allowed;
      box-shadow: none;
    }
    .claim-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(184, 112, 42, 0.25);
    }
    .claim-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* ─── Empty state ─── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: rgba(255, 252, 248, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      border: 1px solid rgba(255, 215, 180, 0.2);
    }
    .empty-state i {
      font-size: 2.5rem;
      color: #d4c8b8;
      margin-bottom: 12px;
    }
    .empty-state h3 {
      color: #5a4030;
      margin-bottom: 6px;
    }
    .empty-state p {
      color: #7a6555;
    }

    /* ─── Reward Animation ─── */
    .reward-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .reward-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .reward-box {
      background: rgba(255, 252, 248, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px 40px;
      text-align: center;
      border: 1px solid rgba(255, 215, 180, 0.3);
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    .reward-overlay.active .reward-box {
      transform: scale(1);
    }
    .reward-box i {
      font-size: 3rem;
      color: #b8702a;
      margin-bottom: 12px;
    }
    .reward-box .amount {
      font-size: 2rem;
      font-weight: 700;
      color: #7a4f2b;
    }
    .reward-box .label {
      font-size: 0.9rem;
      color: #7a6555;
      margin-top: 4px;
    }

    /* ─── Bottom Navigation ─── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 252, 248, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 6px;
      border-top: 1px solid rgba(255, 215, 180, 0.3);
      z-index: 1000;
      box-shadow: 0 -4px 20px rgba(160, 120, 80, 0.06);
    }
    .nav-item {
      text-align: center;
      color: #b8a898;
      font-weight: 500;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
      flex: 1;
      padding: 4px 0;
      text-decoration: none;
    }
    .nav-item:hover {
      transform: translateY(-2px);
    }
    .nav-item.active {
      color: #b8702a;
    }
    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 2px;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* ─── Toast ─── */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,252,248,0.96);
      backdrop-filter: blur(8px);
      padding: 14px 24px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      border: 1px solid rgba(255,215,180,0.3);
      color: #2d241a;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 14px;
      z-index: 1002;
      animation: slideUp 0.35s ease forwards;
      max-width: 90%;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.success i { color: #7a9f5a; }
    .toast.error i { color: #b54a3a; }
    @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    @keyframes slideDown { from { opacity:1; transform:translateX(-50%) translateY(0); } to { opacity:0; transform:translateX(-50%) translateY(20px); } }

    /* ─── Responsive ─── */
    @media (max-width: 520px) {
      .header { padding: 14px 16px; }
      .header h1 { font-size: 1.2rem; }
      .balance-amount { font-size: 1.3rem; }
      .task { padding: 14px; }
    }
  </style>
</head>
<body>

  <!-- ─── AURA LAYERS ─── -->
  <div class="aura-bg" aria-hidden="true">
    <div class="aura-layer-1"></div>
    <div class="aura-layer-2"></div>
  </div>

  <!-- ─── CONTENT ─── -->
  <div class="content-wrapper">

    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-tasks"></i> Missions</h1>
      <div class="header-icons">
        <i class="fas fa-bell" id="notifications"></i>
        <i class="fas fa-question-circle" id="help"></i>
      </div>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
      <div class="balance-info">
        <h2>Your Balance</h2>
        <div class="balance-amount" id="userBalance">₹0</div>
      </div>
      <div class="balance-icon"><i class="fas fa-wallet"></i></div>
    </div>

    <!-- Missions Header -->
    <div class="missions-header">
      <h2 class="section-title">Available Missions</h2>
      <span class="progress-text"><span id="completedCount">0</span>/<span id="totalCount">0</span> done</span>
    </div>

    <!-- Missions List -->
    <div id="missionsList"></div>

  </div>

  <!-- ─── REWARD OVERLAY ─── -->
  <div class="reward-overlay" id="rewardOverlay">
    <div class="reward-box">
      <i class="fas fa-gift"></i>
      <div class="amount">+₹<span id="rewardAmount">0</span></div>
      <div class="label">Mission Completed!</div>
    </div>
  </div>

  <!-- ─── BOTTOM NAV ─── -->
  <div class="bottom-nav">
    <a href="rikshawhome.html" class="nav-item">
      <span class="nav-icon"><i class="fas fa-home"></i></span>
      <span class="nav-label">Home</span>
    </a>
    <a href="plans.html" class="nav-item">
      <span class="nav-icon"><i class="fas fa-tractor"></i></span>
      <span class="nav-label">Plans</span>
    </a>
    <a href="missions.html" class="nav-item active">
      <span class="nav-icon"><i class="fas fa-tasks"></i></span>
      <span class="nav-label">Missions</span>
    </a>
    <a href="team.html" class="nav-item">
      <span class="nav-icon"><i class="fas fa-users"></i></span>
      <span class="nav-label">Team</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon"><i class="fas fa-user"></i></span>
      <span class="nav-label">Profile</span>
    </a>
  </div>

  <!-- ─── FIREBASE MODULE ─── -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYOEdPP3cj6RvJQtSEREtiYe42UIh1Aj8",
      authDomain: "rikshaw-67877.firebaseapp.com",
      databaseURL: "https://rikshaw-67877-default-rtdb.firebaseio.com",
      projectId: "rikshaw-67877",
      storageBucket: "rikshaw-67877.appspot.com",
      messagingSenderId: "953540778276",
      appId: "1:953540778276:web:829ca93f8f973190e0fbb1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUser = null;
    let userData = {};
    let userRef = null;

    // ─── DOM refs ───
    const missionsList = document.getElementById('missionsList');
    const userBalanceEl = document.getElementById('userBalance');
    const completedCountEl = document.getElementById('completedCount');
    const totalCountEl = document.getElementById('totalCount');
    const rewardOverlay = document.getElementById('rewardOverlay');
    const rewardAmountEl = document.getElementById('rewardAmount');

    // ─── Auth ───
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      userRef = ref(db, `users/${user.uid}`);
      loadMissions();
      // Listen for real‑time balance updates
      onValue(userRef, (snap) => {
        if (snap.exists()) {
          userData = snap.val();
          userBalanceEl.textContent = `₹${(userData.balance || 0).toFixed(2)}`;
        }
      });
      // Listen for withdrawal updates to refresh missions
      const withdrawRef = ref(db, `withdrawals/${user.uid}`);
      onValue(withdrawRef, () => loadMissions());
      // Listen for investment updates
      const investRef = ref(db, `users/${user.uid}/investments`);
      onValue(investRef, () => loadMissions());
    });

    // ─── Load Missions ───
    async function loadMissions() {
      if (!userRef) return;
      const snap = await get(userRef);
      if (!snap.exists()) {
        // Initialize user
        await set(userRef, { balance: 0, missions: {} });
        userData = { balance: 0, missions: {} };
      } else {
        userData = snap.val();
        if (!userData.missions) userData.missions = {};
        if (!userData.balance) userData.balance = 0;
      }

      // Build mission data
      const missions = await buildMissions(userData);
      renderMissions(missions);
    }

    // ─── Build Missions ───
    async function buildMissions(user) {
      const now = new Date();
      const today = now.toISOString().split('T')[0];

      // Daily check-in
      const lastCheckin = user.missions.dailyCheckinDate || null;
      const claimedToday = lastCheckin === today;
      const dailyReward = 5;

      // First Investment – check if user has any investments
      const investments = user.investments || {};
      const hasInvestment = Object.keys(investments).length > 0;
      const firstInvestmentClaimed = user.missions.firstInvestment || false;

      // First Withdrawal – check if user has any withdrawal record
      const withdrawalSnap = await get(ref(db, `withdrawals/${currentUser.uid}`));
      const hasWithdrawal = withdrawalSnap.exists() && Object.keys(withdrawalSnap.val()).length > 0;
      const firstWithdrawalClaimed = user.missions.firstWithdrawal || false;

      // Refer a Friend – check if user has referrals (from team node)
      const teamSnap = await get(ref(db, `team/${currentUser.uid}`));
      const hasReferrals = teamSnap.exists() && Object.keys(teamSnap.val()).length > 0;
      const referFriendClaimed = user.missions.referFriend || false;

      // Build mission objects
      const missions = [
        {
          id: 'dailyCheckin',
          title: 'Daily Check‑in',
          description: 'Check in daily to earn rewards.',
          reward: dailyReward,
          claimed: claimedToday,
          progress: claimedToday ? 100 : 0,
          icon: 'calendar-check'
        },
        {
          id: 'firstInvestment',
          title: 'First Investment',
          description: 'Make your first investment to start earning daily income.',
          reward: 20,
          claimed: firstInvestmentClaimed || hasInvestment,
          progress: hasInvestment ? 100 : 0,
          icon: 'rupee-sign'
        },
        {
          id: 'firstWithdrawal',
          title: 'First Withdrawal',
          description: 'Withdraw your earnings for the first time.',
          reward: 30,
          claimed: firstWithdrawalClaimed || hasWithdrawal,
          progress: hasWithdrawal ? 100 : 0,
          icon: 'money-bill-wave'
        },
        {
          id: 'referFriend',
          title: 'Refer a Friend',
          description: 'Invite a friend to join using your referral link.',
          reward: 50,
          claimed: referFriendClaimed || hasReferrals,
          progress: hasReferrals ? 100 : 0,
          icon: 'user-plus'
        }
      ];

      // Auto‑claim logic: if progress is 100 and not claimed, mark as claimed and add reward
      for (const m of missions) {
        if (m.progress === 100 && !m.claimed) {
          // Check if we should auto‑claim (only for investment, withdrawal, referral)
          if (m.id !== 'dailyCheckin') {
            // Auto‑claim and add reward
            m.claimed = true;
            // We'll handle the reward addition in render, but we need to update DB
            // We'll do it when the user clicks claim, so we'll keep it as unclaimed but progress 100
            // So the user can manually claim it
          }
        }
      }

      return missions;
    }

    // ─── Render Missions ───
    function renderMissions(missions) {
      missionsList.innerHTML = '';
      if (missions.length === 0) {
        missionsList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-tasks"></i>
            <h3>No Missions Available</h3>
            <p>Check back later for new missions.</p>
          </div>
        `;
        return;
      }

      let completed = 0;
      missions.forEach((m, index) => {
        const isClaimed = m.claimed;
        if (isClaimed) completed++;

        const task = document.createElement('div');
        task.className = `task ${isClaimed ? 'claimed' : 'pending'}`;
        task.style.animationDelay = `${index * 0.07}s`;

        const progress = m.progress || 0;

        task.innerHTML = `
          <div class="task-header">
            <div class="task-title">
              <span class="task-icon"><i class="fas fa-${m.icon}"></i></span>
              ${m.title}
            </div>
            <span class="task-reward">₹${m.reward}</span>
          </div>
          <div class="task-description">${m.description}</div>
          ${progress > 0 && progress < 100 ? `
            <div class="task-progress">
              <div class="progress-bar" style="width: ${progress}%"></div>
            </div>
          ` : ''}
          <div class="task-footer">
            <span class="task-status ${isClaimed ? 'completed' : 'pending'}">${isClaimed ? 'Completed' : 'In Progress'}</span>
            <button class="claim-btn" ${isClaimed ? 'disabled' : progress < 100 ? 'disabled' : ''}>
              ${isClaimed ? '<i class="fas fa-check-circle"></i> Claimed' : progress < 100 ? '<i class="fas fa-lock"></i> Locked' : '<i class="fas fa-gift"></i> Claim ₹' + m.reward}
            </button>
          </div>
        `;

        // Add event listener for claim button if progress is 100 and not claimed
        const btn = task.querySelector('.claim-btn');
        if (!isClaimed && progress === 100) {
          btn.addEventListener('click', () => claimMission(m.id, m.reward, task));
        }

        missionsList.appendChild(task);
      });

      completedCountEl.textContent = completed;
      totalCountEl.textContent = missions.length;
    }

    // ─── Claim Mission ───
    async function claimMission(missionId, reward, taskElement) {
      if (!userRef) return;
      try {
        // Update balance and mission status
        const newBalance = (userData.balance || 0) + reward;
        const updates = {
          balance: newBalance,
          [`missions.${missionId}`]: true
        };
        if (missionId === 'dailyCheckin') {
          updates['missions.dailyCheckinDate'] = new Date().toISOString().split('T')[0];
        }

        await update(userRef, updates);

        // Show reward animation
        rewardAmountEl.textContent = reward;
        rewardOverlay.classList.add('active');
        setTimeout(() => {
          rewardOverlay.classList.remove('active');
        }, 2000);

        // Update UI: mark as claimed
        const status = taskElement.querySelector('.task-status');
        status.textContent = 'Completed';
        status.className = 'task-status completed';
        const btn = taskElement.querySelector('.claim-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Claimed';

        // Update balance display
        userBalanceEl.textContent = `₹${newBalance.toFixed(2)}`;

        // Update completed count
        const completed = parseInt(completedCountEl.textContent) + 1;
        completedCountEl.textContent = completed;

        // Show toast
        showToast(`₹${reward} claimed successfully!`, 'success');

        // Reload missions to sync state
        setTimeout(loadMissions, 1000);

      } catch (err) {
        console.error('Claim error:', err);
        showToast('Failed to claim. Please try again.', 'error');
      }
    }

    // ─── Toast ───
    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
      const color = type === 'success' ? '#7a9f5a' : '#b54a3a';
      toast.innerHTML = `<i class="fas ${icon}" style="color:${color};"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideDown 0.35s ease forwards';
        setTimeout(() => toast.remove(), 350);
      }, 3500);
    }

    // ─── Helpers ───
    document.getElementById('notifications').addEventListener('click', () => {
      showToast('No new notifications', 'info');
    });
    document.getElementById('help').addEventListener('click', () => {
      showToast('Complete missions to earn rewards. Check back daily!', 'info');
    });
  </script>
</body>
