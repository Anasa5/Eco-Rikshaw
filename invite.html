<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invite - Eco Rikshaw</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Golden Hour – body base for aura blend */
    body {
      background-color: #faf8f2;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #2d241a;
    }

    /* ─── Aura Background (fixed) ─── */
    .aura-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aura-layer-1,
    .aura-layer-2 {
      position: absolute;
      inset: 0;
      transform: translateZ(0);
      will-change: transform;
      pointer-events: none;
    }
    .aura-layer-1 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.12) 28%, rgb(255,255,255) 18%, rgb(255,138,61) 68%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(125px);
    }
    .aura-layer-2 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.22) 34%, rgb(255,255,255) 66%, rgb(255,138,61) 82%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(100px);
    }
    @media (min-width: 768px) {
      .aura-layer-1 { filter: blur(180px); }
      .aura-layer-2 { filter: blur(144px); }
    }

    /* ─── Content wrapper (above aura) ─── */
    .content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── Card ─── */
    .card {
      background: rgba(255, 252, 248, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 180, 0.35);
      box-shadow: 0 8px 32px rgba(160, 120, 80, 0.08), 0 0 0 1px rgba(255, 215, 180, 0.15) inset;
      padding: 32px 28px;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s;
      animation: fadeUp 0.6s ease forwards;
    }
    .card:hover {
      border-color: rgba(200, 150, 100, 0.45);
      box-shadow: 0 12px 40px rgba(160, 120, 80, 0.12), 0 0 0 1px rgba(200, 150, 100, 0.25) inset;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card .icon {
      font-size: 48px;
      color: #b8702a;
      margin-bottom: 12px;
    }
    .card h2 {
      color: #7a4f2b;
      font-weight: 600;
      font-size: 24px;
      margin-bottom: 6px;
    }
    .card p {
      color: #7a6555;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* ─── Referral Code Display ─── */
    .code-display {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px dashed #b8702a;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #b8702a;
      word-break: break-all;
    }

    /* ─── Input group ─── */
    .input-group {
      display: flex;
      margin: 16px 0 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e2d6c8;
      border-right: none;
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      background: rgba(255, 252, 248, 0.6);
      color: #2d241a;
      transition: border-color 0.25s, background 0.25s;
      outline: none;
    }
    .input-group input:focus {
      border-color: #b8702a;
      background: #fffdfa;
    }
    .input-group button {
      background: linear-gradient(145deg, #d48e45, #b8702a);
      color: #fff;
      border: none;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
      font-family: 'Poppins', sans-serif;
    }
    .input-group button:hover {
      background: linear-gradient(145deg, #d8954a, #b8702a);
      transform: scale(1.02);
    }
    .input-group button:active {
      transform: scale(0.97);
    }

    /* ─── Share Button ─── */
    .btn-share {
      background: linear-gradient(145deg, #d48e45, #b8702a);
      color: #fff;
      width: 100%;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s, transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 4px 16px rgba(184, 112, 42, 0.25);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-share:hover {
      background: linear-gradient(145deg, #d8954a, #b8702a);
      box-shadow: 0 6px 24px rgba(184, 112, 42, 0.35);
      transform: translateY(-2px);
    }
    .btn-share:active {
      transform: scale(0.97);
    }

    /* ─── Back link ─── */
    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #7a6555;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .back-link i {
      margin-right: 6px;
    }
    .back-link:hover {
      color: #b8702a;
    }

    /* ─── Responsive ─── */
    @media (max-width: 520px) {
      .card { padding: 24px 18px; }
      .code-display { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- ─── AURA LAYERS ─── -->
  <div class="aura-bg" aria-hidden="true">
    <div class="aura-layer-1"></div>
    <div class="aura-layer-2"></div>
  </div>

  <!-- ─── CONTENT ─── -->
  <div class="content-wrapper">
    <div class="card">
      <div class="icon"><i class="fas fa-user-plus"></i></div>
      <h2>Invite Friends</h2>
      <p>Share your referral link and earn <strong>20%</strong> commission on their earnings!</p>

      <!-- Referral Code Display -->
      <div class="code-display" id="referralCodeDisplay">Loading...</div>

      <!-- Input with link -->
      <div class="input-group">
        <input type="text" id="inviteLink" readonly value="Generating..." />
        <button onclick="copyLink()"><i class="fas fa-copy"></i> Copy</button>
      </div>

      <!-- Share Button -->
      <button class="btn-share" onclick="shareLink()">
        <i class="fas fa-share-alt"></i> Share Link
      </button>

      <a href="rikshawhome.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <!-- ─── FIREBASE MODULE ─── -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYOEdPP3cj6RvJQtSEREtiYe42UIh1Aj8",
      authDomain: "rikshaw-67877.firebaseapp.com",
      databaseURL: "https://rikshaw-67877-default-rtdb.firebaseio.com",
      projectId: "rikshaw-67877",
      storageBucket: "rikshaw-67877.appspot.com",
      messagingSenderId: "953540778276",
      appId: "1:953540778276:web:829ca93f8f973190e0fbb1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase();
    const auth = getAuth();

    let currentUid = null;
    let referralCode = '';

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUid = user.uid;
      loadOrGenerateReferral();
    });

    async function loadOrGenerateReferral() {
      const userRef = ref(db, `users/${currentUid}`);
      const snap = await get(userRef);
      if (!snap.exists()) {
        // Should not happen, but create initial data
        await update(userRef, { referralCode: generateCode() });
      }
      const data = snap.val();
      let code = data.referralCode;
      if (!code) {
        code = generateCode();
        await update(userRef, { referralCode: code });
      }
      referralCode = code;
      updateUI(code);
    }

    function generateCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function updateUI(code) {
      const linkInput = document.getElementById('inviteLink');
      const display = document.getElementById('referralCodeDisplay');
      const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/') + 'register.html';
      const fullLink = `${baseUrl}?ref=${code}`;
      linkInput.value = fullLink;
      display.textContent = `🔗 ${code}`;
    }

    // ─── Expose functions globally ───
    window.copyLink = function() {
      const input = document.getElementById('inviteLink');
      input.select();
      input.setSelectionRange(0, 99999);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(input.value).then(() => {
          showToast('Link copied to clipboard!');
        }).catch(() => {
          document.execCommand('copy');
          showToast('Link copied!');
        });
      } else {
        document.execCommand('copy');
        showToast('Link copied!');
      }
    };

    window.shareLink = function() {
      const link = document.getElementById('inviteLink').value;
      if (navigator.share) {
        navigator.share({
          title: 'Join Eco Rikshaw',
          text: 'Use my referral link to join Eco Rikshaw and start earning!',
          url: link
        }).catch(() => {});
      } else {
        // Fallback: copy link and show a message
        window.copyLink();
        alert('Link copied! Share it with your friends.');
      }
    };

    // ─── Toast notification ───
    function showToast(message) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.cssText = `
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255,252,248,0.95);
        backdrop-filter: blur(8px);
        padding: 14px 24px;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.15);
        border: 1px solid rgba(255,215,180,0.3);
        color: #2d241a;
        font-family: 'Poppins', sans-serif;
        font-weight: 500;
        font-size: 14px;
        z-index: 1002;
        animation: slideUp 0.35s ease forwards;
        max-width: 90%;
        text-align: center;
      `;
      toast.innerHTML = `<i class="fas fa-check-circle" style="color:#b8702a;margin-right:10px;"></i>${message}`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideDown 0.35s ease forwards';
        setTimeout(() => toast.remove(), 350);
      }, 3000);
    }

    // ─── Add keyframes for toast ───
    const styleSheet = document.createElement("style");
    styleSheet.textContent = `
      @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
      @keyframes slideDown { from { opacity:1; transform:translateX(-50%) translateY(0); } to { opacity:0; transform:translateX(-50%) translateY(20px); } }
    `;
    document.head.appendChild(styleSheet);
  </script>
</body>
</html>
