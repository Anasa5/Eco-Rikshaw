<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rikshaw Service</title>
    <!-- Firebase SDK (unchanged) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ─── Reset & base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Golden Hour – body base color for blend modes */
        body {
            background-color: #faf8f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* ─── Aura Background (fixed) ─── */
        .aura-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            /* NO background – blends with body */
        }

        .aura-layer-1,
        .aura-layer-2 {
            position: absolute;
            inset: 0;
            transform: translateZ(0);
            will-change: transform;
            pointer-events: none;
        }

        .aura-layer-1 {
            background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.12) 28%, rgb(255,255,255) 18%, rgb(255,138,61) 68%, rgb(183,77,0) 100%);
            mix-blend-mode: multiply;
            filter: blur(125px);
        }

        .aura-layer-2 {
            background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.22) 34%, rgb(255,255,255) 66%, rgb(255,138,61) 82%, rgb(183,77,0) 100%);
            mix-blend-mode: multiply;
            filter: blur(100px);
        }

        @media (min-width: 768px) {
            .aura-layer-1 { filter: blur(180px); }
            .aura-layer-2 { filter: blur(144px); }
        }

        /* ─── Content wrapper (above aura) ─── */
        .content-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        /* ─── Login card – refined glass style ─── */
        .login-container {
            background: rgba(255, 252, 248, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 180, 0.35);
            box-shadow: 0 8px 32px rgba(160, 120, 80, 0.08), 0 0 0 1px rgba(255, 215, 180, 0.15) inset;
            padding: 40px 36px;
            text-align: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            border-color: rgba(200, 150, 100, 0.45);
            box-shadow: 0 12px 40px rgba(160, 120, 80, 0.12), 0 0 0 1px rgba(200, 150, 100, 0.25) inset;
        }

        /* Logo – keep your existing logo handling */
        .logo {
            width: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #7a4f2b;
            margin-bottom: 28px;
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -0.3px;
        }

        /* ─── Form groups ─── */
        .input-group {
            margin-bottom: 20px;
            position: relative;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #5a4030;
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.2px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            padding-right: 44px; /* space for icon */
            border: 1.5px solid #e2d6c8;
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255, 252, 248, 0.6);
            color: #2d241a;
            caret-color: #b8702a;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            -webkit-appearance: none;
        }

        .input-group input::placeholder {
            color: #b8a898;
            font-weight: 400;
            font-size: 14px;
            opacity: 0.75;
        }

        .input-group input:hover {
            border-color: #cbb9a8;
            background: rgba(255, 252, 248, 0.85);
        }

        .input-group input:focus {
            outline: none;
            border-color: #b8702a;
            background: #fffdfa;
            box-shadow: 0 0 0 4px rgba(184, 112, 42, 0.12), 0 2px 8px rgba(184, 112, 42, 0.05);
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 42px; /* aligns with input padding */
            color: #b8a898;
            font-size: 18px;
            transition: color 0.25s ease;
            pointer-events: none;
        }

        .input-group:focus-within i {
            color: #b8702a;
        }

        /* ─── Remember & Forgot ─── */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #5a4030;
        }

        .remember-me input {
            margin-right: 8px;
            accent-color: #b8702a;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password a {
            color: #b8702a;
            text-decoration: none;
            transition: color 0.2s ease, text-decoration-color 0.2s ease;
            text-decoration: underline transparent 1.5px;
            text-underline-offset: 3px;
        }

        .forgot-password a:hover {
            color: #9a5f22;
            text-decoration-color: #b8702a;
        }

        /* ─── Login button ─── */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #d48e45, #b8702a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.18s ease;
            box-shadow: 0 4px 16px rgba(184, 112, 42, 0.25);
        }

        .login-btn:hover {
            background: linear-gradient(145deg, #d8954a, #b8702a);
            box-shadow: 0 6px 24px rgba(184, 112, 42, 0.35);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: scale(0.975);
            box-shadow: 0 2px 8px rgba(184, 112, 42, 0.20);
        }

        /* ─── Messages ─── */
        .error-message,
        .success-message {
            margin-top: 12px;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }

        .error-message {
            color: #b54a3a;
        }

        .success-message {
            color: #7a9f5a;
        }

        /* ─── Signup link ─── */
        .signup-link {
            margin-top: 22px;
            color: #5a4030;
            font-size: 14px;
        }

        .signup-link a {
            color: #b8702a;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease, text-decoration-color 0.2s ease;
            text-decoration: underline transparent 1.5px;
            text-underline-offset: 3px;
        }

        .signup-link a:hover {
            color: #9a5f22;
            text-decoration-color: #b8702a;
        }

        /* ─── Responsive ─── */
        @media (max-width: 520px) {
            body {
                padding: 16px;
            }
            .login-container {
                padding: 28px 18px;
                border-radius: 16px;
            }
            .input-group input {
                padding: 12px 14px;
                padding-right: 40px;
                font-size: 14px;
            }
            .input-group i {
                top: 40px;
                right: 12px;
            }
        }

        /* ─── Autofill fix ─── */
        input:-webkit-autofill {
            transition: background-color 5000s ease-in-out 0s;
            -webkit-box-shadow: 0 0 0 30px #fffdfa inset !important;
        }
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px #fffdfa inset, 0 0 0 4px rgba(184, 112, 42, 0.12) !important;
        }
    </style>
</head>
<body>
    <!-- ─── AURA LAYERS ─── -->
    <div class="aura-bg" aria-hidden="true">
        <div class="aura-layer-1"></div>
        <div class="aura-layer-2"></div>
    </div>

    <!-- ─── CONTENT ─── -->
    <div class="content-wrapper">
        <div class="login-container">
            <!-- Logo (handles missing image gracefully) -->
            <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            <h1>Login to Your Account</h1>

            <form id="loginForm">
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    <i class="fas fa-phone"></i>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-lock"></i>
                </div>

                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>
    </div>

    <!-- ─── FIREBASE (unchanged logic) ─── -->
    <script>
        // Firebase config (unchanged)
        const firebaseConfig = {
            apiKey: "AIzaSyBYOEdPP3cj6RvJQtSEREtiYe42UIh1Aj8",
            authDomain: "rikshaw-67877.firebaseapp.com",
            databaseURL: "https://rikshaw-67877-default-rtdb.firebaseio.com",
            projectId: "rikshaw-67877",
            storageBucket: "rikshaw-67877.appspot.com",
            messagingSenderId: "953540778276",
            appId: "1:953540778276:web:829ca93f8f973190e0fbb1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Login handler
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            if (!phone || !password) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }

            const email = phone + "@rikshaw.com";

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    successMessage.textContent = 'Login successful! Redirecting...';
                    successMessage.style.display = 'block';
                    localStorage.setItem("uid", user.uid);

                    setTimeout(() => {
                        window.location.href = 'rikshawhome.html';
                    }, 1500);
                })
                .catch((error) => {
                    const errorCode = error.code;
                    let userFriendlyError = "Login failed. Please try again.";

                    if (errorCode === 'auth/user-not-found') {
                        userFriendlyError = "User not found. Please sign up first.";
                    } else if (errorCode === 'auth/wrong-password') {
                        userFriendlyError = "Incorrect password. Please try again.";
                    }

                    errorMessage.textContent = userFriendlyError;
                    errorMessage.style.display = 'block';
                    console.error('Login error:', errorCode, error.message);
                });
        });
    </script>
</body>
</html>
