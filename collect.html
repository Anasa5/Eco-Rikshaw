<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collect Earnings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #faf8f2;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      padding: 16px 16px 80px;
      color: #2d241a;
    }

    /* ─── Aura Background ─── */
    .aura-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aura-layer-1,
    .aura-layer-2 {
      position: absolute;
      inset: 0;
      transform: translateZ(0);
      will-change: transform;
      pointer-events: none;
    }
    .aura-layer-1 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.12) 28%, rgb(255,255,255) 18%, rgb(255,138,61) 68%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(125px);
    }
    .aura-layer-2 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.22) 34%, rgb(255,255,255) 66%, rgb(255,138,61) 82%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(100px);
    }
    @media (min-width: 768px) {
      .aura-layer-1 { filter: blur(180px); }
      .aura-layer-2 { filter: blur(144px); }
    }

    /* ─── Content Wrapper ─── */
    .content-wrapper {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ─── Header ─── */
    .header {
      background: rgba(255, 252, 248, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 180, 0.30);
      box-shadow: 0 4px 16px rgba(160, 120, 80, 0.06);
      padding: 18px 20px;
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #7a4f2b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .header:hover {
      border-color: rgba(200, 150, 100, 0.45);
      box-shadow: 0 6px 24px rgba(160, 120, 80, 0.10);
    }
    .header i {
      color: #b8702a;
      font-size: 1.6rem;
    }

    /* ─── Plan Card ─── */
    .plan-card {
      background: rgba(255, 252, 248, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 18px;
      border: 1px solid rgba(255, 215, 180, 0.25);
      box-shadow: 0 4px 12px rgba(160, 120, 80, 0.06);
      padding: 20px 18px;
      margin-bottom: 16px;
      transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
    }
    .plan-card:nth-child(2) { animation-delay: 0.08s; }
    .plan-card:nth-child(3) { animation-delay: 0.16s; }
    .plan-card:nth-child(4) { animation-delay: 0.24s; }
    .plan-card:nth-child(5) { animation-delay: 0.32s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .plan-card:hover {
      transform: translateY(-4px);
      border-color: rgba(200, 150, 100, 0.45);
      box-shadow: 0 10px 30px rgba(160, 120, 80, 0.10), 0 0 0 1px rgba(200, 150, 100, 0.15) inset;
    }

    .plan-card h3 {
      margin: 0 0 12px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #7a4f2b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .plan-card h3 i {
      color: #b8702a;
      font-size: 1.3rem;
    }

    .plan-detail {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(200, 180, 160, 0.15);
      font-size: 0.95rem;
    }
    .plan-detail:last-of-type {
      border-bottom: none;
    }
    .plan-detail .label {
      color: #7a6555;
    }
    .plan-detail .value {
      font-weight: 600;
      color: #2d241a;
    }
    .plan-detail .value.highlight {
      color: #b8702a;
    }

    /* ─── Progress Bar ─── */
    .progress-wrap {
      margin-top: 14px;
      background: rgba(200, 180, 160, 0.15);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #d48e45, #b8702a);
      border-radius: 20px;
      width: 0%;
      transition: width 0.6s ease;
    }

    /* ─── Cooldown text ─── */
    .cooldown {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #7a6555;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cooldown i {
      color: #b8702a;
      font-size: 0.9rem;
    }

    /* ─── Collect Button ─── */
    .collect-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      background: linear-gradient(145deg, #d48e45, #b8702a);
      color: #fff;
      box-shadow: 0 4px 12px rgba(184, 112, 42, 0.20);
    }
    .collect-btn:hover:enabled {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(184, 112, 42, 0.30);
    }
    .collect-btn:active {
      transform: scale(0.97);
    }
    .collect-btn:disabled {
      background: rgba(200, 180, 160, 0.25);
      color: #7a6555;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .collect-btn i {
      font-size: 1.1rem;
    }

    /* ─── Empty State ─── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: rgba(255, 252, 248, 0.7);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 180, 0.2);
    }
    .empty-state i {
      font-size: 3rem;
      color: #d4c8b8;
      margin-bottom: 16px;
    }
    .empty-state p {
      color: #7a6555;
      margin: 4px 0;
    }
    .empty-state p:first-of-type {
      font-weight: 500;
      font-size: 1.1rem;
      color: #5a4030;
    }

    /* ─── Loading ─── */
    .loading {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(200, 180, 160, 0.2);
      border-radius: 50%;
      border-top-color: #b8702a;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Toast Notification ─── */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 252, 248, 0.96);
      backdrop-filter: blur(8px);
      padding: 14px 24px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      border: 1px solid rgba(255, 215, 180, 0.3);
      color: #2d241a;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 14px;
      z-index: 1002;
      animation: slideUp 0.35s ease forwards;
      max-width: 90%;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.success i { color: #7a9f5a; }
    .toast.error i { color: #b54a3a; }
    @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    @keyframes slideDown { from { opacity:1; transform:translateX(-50%) translateY(0); } to { opacity:0; transform:translateX(-50%) translateY(20px); } }

    /* ─── Responsive ─── */
    @media (max-width: 520px) {
      .header { font-size: 1.2rem; padding: 14px; }
      .plan-card { padding: 16px; }
      .collect-btn { font-size: 0.9rem; padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- ─── AURA LAYERS ─── -->
  <div class="aura-bg" aria-hidden="true">
    <div class="aura-layer-1"></div>
    <div class="aura-layer-2"></div>
  </div>

  <!-- ─── CONTENT ─── -->
  <div class="content-wrapper">
    <!-- Header -->
    <div class="header">
      <i class="fas fa-wallet"></i> Collect Earnings
    </div>

    <!-- Plans Container -->
    <div id="plansContainer">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ─── FIREBASE MODULE ─── -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYOEdPP3cj6RvJQtSEREtiYe42UIh1Aj8",
      authDomain: "rikshaw-67877.firebaseapp.com",
      databaseURL: "https://rikshaw-67877-default-rtdb.firebaseio.com",
      projectId: "rikshaw-67877",
      storageBucket: "rikshaw-67877.appspot.com",
      messagingSenderId: "953540778276",
      appId: "1:953540778276:web:829ca93f8f973190e0fbb1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase();
    const auth = getAuth();

    // ─── Toast system ───
    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
      const color = type === 'success' ? '#7a9f5a' : '#b54a3a';
      toast.innerHTML = `<i class="fas ${icon}" style="color:${color};"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideDown 0.35s ease forwards';
        setTimeout(() => toast.remove(), 350);
      }, 3500);
    }

    // ─── Auth ───
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loadPlans(user.uid);
      } else {
        window.location.href = "login.html";
      }
    });

    // ─── Load Plans ───
    async function loadPlans(uid) {
      const userRef = ref(db, `users/${uid}`);
      const container = document.getElementById('plansContainer');

      try {
        const snapshot = await get(userRef);
        if (!snapshot.exists()) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-box-open"></i>
              <p>No investment plans found</p>
              <p>Start investing to see earnings here</p>
            </div>
          `;
          return;
        }

        const user = snapshot.val();
        const investments = user.investments || {};

        if (Object.keys(investments).length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-box-open"></i>
              <p>No active investments</p>
              <p>Start investing to earn daily income</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';

        for (const [id, plan] of Object.entries(investments)) {
          const lastCollected = plan.lastCollectionDate ? new Date(plan.lastCollectionDate).getTime() : 0;
          const now = Date.now();
          const hoursPassed = (now - lastCollected) / (1000 * 60 * 60);
          const canCollect = hoursPassed >= 24;
          const progress = Math.min(100, (hoursPassed / 24) * 100);

          const card = document.createElement('div');
          card.className = 'plan-card';
          card.innerHTML = `
            <h3><i class="fas fa-piggy-bank"></i> ${plan.planName}</h3>
            <div class="plan-detail">
              <span class="label">Daily Income</span>
              <span class="value highlight">₹${plan.dailyIncome.toLocaleString()}</span>
            </div>
            <div class="plan-detail">
              <span class="label">Total Return</span>
              <span class="value">₹${plan.totalIncome.toLocaleString()}</span>
            </div>

            ${!canCollect ? `
              <div class="progress-wrap">
                <div class="progress-bar" style="width: ${progress}%"></div>
              </div>
              <div class="cooldown">
                <i class="fas fa-clock"></i>
                Next collection in ${Math.ceil(24 - hoursPassed)}h
              </div>
            ` : `
              <div class="cooldown" style="color:#7a9f5a;">
                <i class="fas fa-check-circle"></i> Ready to collect
              </div>
            `}

            <button class="collect-btn" ${canCollect ? '' : 'disabled'}>
              <i class="fas ${canCollect ? 'fa-coins' : 'fa-clock'}"></i>
              ${canCollect ? `Collect ₹${plan.dailyIncome.toLocaleString()}` : 'Waiting...'}
            </button>
          `;

          const btn = card.querySelector('.collect-btn');
          if (canCollect) {
            btn.addEventListener('click', async () => {
              if (!confirm(`Collect ₹${plan.dailyIncome.toLocaleString()} from ${plan.planName}?`)) return;

              const originalText = btn.innerHTML;
              btn.disabled = true;
              btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;

              try {
                const userSnap = await get(userRef);
                if (!userSnap.exists()) throw new Error('User not found');
                const currentBalance = userSnap.val().balance || 0;
                const newBal = currentBalance + plan.dailyIncome;

                const updates = {
                  balance: newBal,
                  [`investments/${id}/lastCollectionDate`]: new Date().toISOString(),
                  [`earnings/${Date.now()}`]: {
                    amount: plan.dailyIncome,
                    date: new Date().toISOString(),
                    type: 'daily',
                    investment: id,
                    planName: plan.planName
                  }
                };

                await update(userRef, updates);
                showToast(`₹${plan.dailyIncome.toLocaleString()} collected successfully!`, 'success');
                loadPlans(uid); // refresh
              } catch (err) {
                console.error('Collection error:', err);
                showToast('Failed to collect. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
              }
            });
          }

          container.appendChild(card);
        }
      } catch (error) {
        console.error('Error loading plans:', error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Error loading investments</p>
            <p>Please try again later</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
