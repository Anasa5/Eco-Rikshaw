<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collect Earnings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-cream: #faf8f2;
      --color-amber: #b8702a;
      --color-amber-dark: #9a5f22;
      --color-wood: #5a4030;
      --color-moss: #7a9f5a;
      --color-terracotta: #b54a3a;
      --shadow-soft: 0 4px 12px rgba(160, 120, 80, 0.06);
      --shadow-medium: 0 8px 24px rgba(160, 120, 80, 0.12);
    }

    body {
      background-color: var(--color-cream);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      padding: 16px 16px 80px;
      color: var(--color-wood);
    }

    /* ─── Aura Background ─── */
    .aura-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aura-layer-1,
    .aura-layer-2 {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .aura-layer-1 {
      background: 
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(255,183,77,0.20) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(255,138,61,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255,255,255,0.15) 0%, transparent 50%);
      mix-blend-mode: multiply;
    }
    .aura-layer-2 {
      background: 
        radial-gradient(ellipse 70% 50% at 60% 70%, rgba(255,183,77,0.15) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 30% 30%, rgba(183,77,0,0.08) 0%, transparent 55%);
      mix-blend-mode: multiply;
    }

    /* ─── Content Wrapper ─── */
    .content-wrapper {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ─── Header ─── */
    .header {
      background: rgba(255,252,248,0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      border: 1px solid rgba(255,215,180,0.30);
      box-shadow: 0 4px 16px rgba(160,120,80,0.06);
      padding: 18px 20px;
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #7a4f2b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .header:hover {
      border-color: rgba(200,150,100,0.45);
      box-shadow: 0 6px 24px rgba(160,120,80,0.10);
    }
    .header i {
      color: var(--color-amber);
      font-size: 1.6rem;
    }

    /* ─── Plan Card ─── */
    .plan-card {
      background: rgba(255,252,248,0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 18px;
      border: 1px solid rgba(255,215,180,0.25);
      box-shadow: var(--shadow-soft);
      padding: 20px 18px;
      margin-bottom: 16px;
      transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
    }
    .plan-card:nth-child(2) { animation-delay: 0.08s; }
    .plan-card:nth-child(3) { animation-delay: 0.16s; }
    .plan-card:nth-child(4) { animation-delay: 0.24s; }
    .plan-card:nth-child(5) { animation-delay: 0.32s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .plan-card:hover {
      transform: translateY(-4px);
      border-color: rgba(200,150,100,0.45);
      box-shadow: var(--shadow-medium), 0 0 0 1px rgba(200,150,100,0.15) inset;
    }

    .plan-card h3 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 12px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #7a4f2b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .plan-card h3 i {
      color: var(--color-amber);
      font-size: 1.3rem;
    }

    .plan-detail {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(200,180,160,0.15);
      font-size: 0.95rem;
    }
    .plan-detail:last-of-type {
      border-bottom: none;
    }
    .plan-detail .label {
      color: #7a6555;
    }
    .plan-detail .value {
      font-weight: 600;
      color: var(--color-wood);
    }
    .plan-detail .value.highlight {
      color: var(--color-amber);
    }

    /* ─── Progress Bar ─── */
    .progress-wrap {
      margin-top: 14px;
      background: rgba(200,180,160,0.15);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #d48e45, var(--color-amber));
      border-radius: 20px;
      width: 0%;
      transition: width 0.6s ease;
    }

    /* ─── Status / Cooldown ─── */
    .status-row {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #7a6555;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .status-row .left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-row .left i {
      color: var(--color-amber);
      font-size: 0.9rem;
    }
    .status-row .ready {
      color: var(--color-moss);
    }
    .status-row .ready i {
      color: var(--color-moss);
    }
    .status-row .expired {
      color: var(--color-terracotta);
    }
    .status-row .expired i {
      color: var(--color-terracotta);
    }

    /* ─── Collect Button ─── */
    .collect-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      background: linear-gradient(145deg, #d48e45, var(--color-amber));
      color: #fff;
      box-shadow: 0 4px 12px rgba(184,112,42,0.20);
    }
    .collect-btn:hover:enabled {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(184,112,42,0.30);
    }
    .collect-btn:active {
      transform: scale(0.97);
    }
    .collect-btn:disabled {
      background: rgba(200,180,160,0.25);
      color: #7a6555;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .collect-btn i {
      font-size: 1.1rem;
    }
    .collect-btn:focus-visible {
      outline: 2px solid var(--color-amber);
      outline-offset: 2px;
    }

    /* ─── Empty State ─── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: rgba(255,252,248,0.7);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      border: 1px solid rgba(255,215,180,0.2);
    }
    .empty-state i {
      font-size: 3rem;
      color: #d4c8b8;
      margin-bottom: 16px;
    }
    .empty-state p {
      color: #7a6555;
      margin: 4px 0;
    }
    .empty-state p:first-of-type {
      font-weight: 500;
      font-size: 1.1rem;
      color: #5a4030;
    }

    /* ─── Loading ─── */
    .loading {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(200,180,160,0.2);
      border-radius: 50%;
      border-top-color: var(--color-amber);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Toast Notification ─── */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,252,248,0.96);
      backdrop-filter: blur(8px);
      padding: 14px 24px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      border: 1px solid rgba(255,215,180,0.3);
      color: var(--color-wood);
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 14px;
      z-index: 1002;
      animation: slideUp 0.35s ease forwards;
      max-width: 90%;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.success i { color: var(--color-moss); }
    .toast.error i { color: var(--color-terracotta); }
    @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    @keyframes slideDown { from { opacity:1; transform:translateX(-50%) translateY(0); } to { opacity:0; transform:translateX(-50%) translateY(20px); } }

    /* ─── Confirmation Modal ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: rgba(255,252,248,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 90%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      transform: scale(0.95) translateY(10px);
      transition: transform 0.3s ease;
      border: 1px solid rgba(255,215,180,0.3);
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-overlay.active .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      background: linear-gradient(145deg, #d48e45, var(--color-amber));
      color: #fff;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Playfair Display', serif;
    }
    .modal-header .close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s;
      line-height: 1;
      font-family: 'Poppins', sans-serif;
    }
    .modal-header .close-modal:hover {
      transform: rotate(90deg);
    }
    .modal-header .close-modal:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
      border-radius: 4px;
    }

    .modal-body {
      padding: 24px 20px;
      overflow-y: auto;
      flex: 1;
      text-align: center;
    }
    .modal-body .confirm-icon {
      font-size: 48px;
      color: var(--color-amber);
      margin-bottom: 12px;
    }
    .modal-body .confirm-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: #7a4f2b;
      margin-bottom: 6px;
    }
    .modal-body .confirm-subtitle {
      font-size: 14px;
      color: #7a6555;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .modal-body .confirm-details {
      background: rgba(255,255,255,0.4);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: left;
    }
    .modal-body .confirm-details .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px dashed rgba(200,180,160,0.15);
      font-size: 14px;
    }
    .modal-body .confirm-details .detail-row:last-child {
      border-bottom: none;
    }
    .modal-body .confirm-details .label {
      color: #7a6555;
    }
    .modal-body .confirm-details .value {
      font-weight: 600;
      color: var(--color-wood);
    }
    .modal-body .confirm-details .value.highlight {
      color: var(--color-amber);
    }

    .modal-footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 20px 24px;
      flex-shrink: 0;
    }
    .modal-footer .modal-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      flex: 1;
      max-width: 160px;
      font-family: 'Poppins', sans-serif;
    }
    .modal-footer .modal-btn.cancel {
      background: rgba(200,180,160,0.2);
      color: var(--color-wood);
    }
    .modal-footer .modal-btn.cancel:hover {
      background: rgba(200,180,160,0.35);
    }
    .modal-footer .modal-btn.cancel:focus-visible {
      outline: 2px solid var(--color-amber);
      outline-offset: 2px;
    }
    .modal-footer .modal-btn.confirm {
      background: linear-gradient(145deg, #d48e45, var(--color-amber));
      color: #fff;
      box-shadow: 0 4px 12px rgba(184,112,42,0.20);
    }
    .modal-footer .modal-btn.confirm:hover {
      box-shadow: 0 6px 20px rgba(184,112,42,0.30);
      transform: translateY(-2px);
    }
    .modal-footer .modal-btn.confirm:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .modal-footer .modal-btn:active {
      transform: scale(0.96);
    }
    .modal-footer .modal-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* ─── Prefers Reduced Motion ─── */
    @media (prefers-reduced-motion: reduce) {
      .plan-card,
      .collect-btn,
      .modal-overlay,
      .modal-content,
      .toast,
      .header {
        transition: none !important;
      }
      .plan-card:hover,
      .collect-btn:hover:enabled {
        transform: none !important;
      }
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ─── Responsive ─── */
    @media (max-width: 520px) {
      .header { font-size: 1.2rem; padding: 14px; }
      .plan-card { padding: 16px; }
      .collect-btn { font-size: 0.9rem; padding: 12px; }
      .status-row { font-size: 0.75rem; }
      .modal-content { max-width: 95%; }
    }
  </style>
</head>
<body>

  <!-- ─── AURA LAYERS ─── -->
  <div class="aura-bg" aria-hidden="true">
    <div class="aura-layer-1"></div>
    <div class="aura-layer-2"></div>
  </div>

  <!-- ─── CONTENT ─── -->
  <div class="content-wrapper">
    <!-- Header -->
    <div class="header">
      <i class="fas fa-wallet"></i> Collect Earnings
    </div>

    <!-- Plans Container -->
    <div id="plansContainer">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ─── CONFIRMATION MODAL ─── -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Confirm Collection</span>
        <button class="close-modal" id="confirmCloseBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="confirm-icon"><i class="fas fa-coins"></i></div>
        <div class="confirm-title" id="confirmTitle">Collect Daily Income</div>
        <div class="confirm-subtitle" id="confirmMessage">Are you sure you want to collect your daily earnings from this plan?</div>
        <div class="confirm-details" id="confirmDetails">
          <div class="detail-row"><span class="label">Plan</span><span class="value" id="confirmPlanName">Eco Rikshaw (A)</span></div>
          <div class="detail-row"><span class="label">Daily Income</span><span class="value highlight" id="confirmAmount">₹109.8</span></div>
          <div class="detail-row"><span class="label">Collected So Far</span><span class="value" id="confirmCollected">₹0</span></div>
          <div class="detail-row"><span class="label">Days Collected</span><span class="value" id="confirmDaysCount">0/10</span></div>
        </div>
        <div style="font-size:13px; color:#7a6555; margin-top:8px;">
          <i class="fas fa-info-circle"></i> This amount will be added to your balance immediately.
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn cancel" id="confirmCancelBtn">Cancel</button>
        <button class="modal-btn confirm" id="confirmConfirmBtn">Confirm Collect</button>
      </div>
    </div>
  </div>

  <!-- ─── FIREBASE MODULE ─── -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYOEdPP3cj6RvJQtSEREtiYe42UIh1Aj8",
      authDomain: "rikshaw-67877.firebaseapp.com",
      databaseURL: "https://rikshaw-67877-default-rtdb.firebaseio.com",
      projectId: "rikshaw-67877",
      storageBucket: "rikshaw-67877.appspot.com",
      messagingSenderId: "953540778276",
      appId: "1:953540778276:web:829ca93f8f973190e0fbb1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase();
    const auth = getAuth();

    // ─── Toast system ───
    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
      const color = type === 'success' ? '#7a9f5a' : '#b54a3a';
      toast.innerHTML = `<i class="fas ${icon}" style="color:${color};"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideDown 0.35s ease forwards';
        setTimeout(() => toast.remove(), 350);
      }, 3500);
    }

    // ─── Confirmation Modal ───
    function showConfirmation(options) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirmModal');
        const title = document.getElementById('confirmTitle');
        const message = document.getElementById('confirmMessage');
        const planName = document.getElementById('confirmPlanName');
        const amount = document.getElementById('confirmAmount');
        const collected = document.getElementById('confirmCollected');
        const daysCount = document.getElementById('confirmDaysCount');
        const confirmBtn = document.getElementById('confirmConfirmBtn');
        const cancelBtn = document.getElementById('confirmCancelBtn');
        const closeBtn = document.getElementById('confirmCloseBtn');

        title.textContent = options.title || 'Collect Daily Income';
        message.textContent = options.message || 'Are you sure you want to collect your daily earnings?';
        planName.textContent = options.planName || 'Plan';
        amount.textContent = `₹${options.amount || 0}`;
        collected.textContent = `₹${options.collected || 0}`;
        daysCount.textContent = `${options.collectionCount || 0}/${options.duration || 0} days`;

        modal.classList.add('active');

        function cleanup() {
          modal.classList.remove('active');
          confirmBtn.removeEventListener('click', onConfirm);
          cancelBtn.removeEventListener('click', onCancel);
          closeBtn.removeEventListener('click', onCancel);
        }

        function onConfirm() {
          cleanup();
          resolve(true);
        }

        function onCancel() {
          cleanup();
          resolve(false);
        }

        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
        closeBtn.addEventListener('click', onCancel);

        modal.addEventListener('click', function handler(e) {
          if (e.target === modal) {
            cleanup();
            resolve(false);
            modal.removeEventListener('click', handler);
          }
        });
      });
    }

    // ─── Auth ───
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loadPlans(user.uid);
      } else {
        window.location.href = "login.html";
      }
    });

    // ─── Load Plans ───
    async function loadPlans(uid) {
      const userRef = ref(db, `users/${uid}`);
      const container = document.getElementById('plansContainer');

      try {
        const snapshot = await get(userRef);
        if (!snapshot.exists()) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-box-open"></i>
              <p>No investment plans found</p>
              <p>Start investing to see earnings here</p>
            </div>
          `;
          return;
        }

        const user = snapshot.val();
        const investments = user.investments || {};
        const earnings = user.earnings || {};

        if (Object.keys(investments).length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-box-open"></i>
              <p>No active investments</p>
              <p>Start investing to earn daily income</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';

        const now = Date.now();

        for (const [id, plan] of Object.entries(investments)) {
          const purchased = plan.purchased ? new Date(plan.purchased).getTime() : now;
          const durationDays = plan.days || 0;
          const totalIncome = plan.totalIncome || 0;
          const dailyIncome = plan.dailyIncome || 0;

          const msPerDay = 86400000;
          const daysSincePurchase = (now - purchased) / msPerDay;
          const isExpired = daysSincePurchase >= durationDays && durationDays > 0;
          const daysRemaining = Math.max(0, durationDays - daysSincePurchase);

          let totalCollected = 0;
          let collectionCount = 0;
          for (const earnKey in earnings) {
            const e = earnings[earnKey];
            if (e.investment === id && e.type === 'daily' && e.amount > 0) {
              totalCollected += e.amount;
              collectionCount++;
            }
          }

          const lastCollected = plan.lastCollectionDate ? new Date(plan.lastCollectionDate).getTime() : 0;
          const hoursSinceLast = (now - lastCollected) / (1000 * 60 * 60);
          const canCollect = !isExpired && hoursSinceLast >= 24;

          const progress = durationDays > 0 ? Math.min(100, (daysSincePurchase / durationDays) * 100) : 0;

          const card = document.createElement('div');
          card.className = 'plan-card';
          card.innerHTML = `
            <h3><i class="fas fa-piggy-bank"></i> ${plan.planName}</h3>
            <div class="plan-detail">
              <span class="label">Daily Income</span>
              <span class="value highlight">₹${dailyIncome.toLocaleString()}</span>
            </div>
            <div class="plan-detail">
              <span class="label">Total Return</span>
              <span class="value">₹${totalIncome.toLocaleString()}</span>
            </div>
            <div class="plan-detail">
              <span class="label">Collected</span>
              <span class="value">₹${totalCollected.toLocaleString()}</span>
            </div>
            <div class="plan-detail">
              <span class="label">Status</span>
              <span class="value">${isExpired ? '✅ Completed' : `${Math.ceil(daysRemaining)} days left`}</span>
            </div>

            ${!isExpired ? `
              <div class="progress-wrap">
                <div class="progress-bar" style="width: ${progress}%"></div>
              </div>
            ` : ''}

            <div class="status-row">
              <span class="left">
                <i class="fas ${isExpired ? 'fa-check-circle' : (canCollect ? 'fa-clock' : 'fa-hourglass-half')}"></i>
                ${isExpired ? 'Plan finished' : (canCollect ? 'Ready to collect' : `Next in ${Math.ceil(24 - hoursSinceLast)}h`)}
              </span>
              <span>${collectionCount}/${durationDays} days</span>
            </div>

            <button class="collect-btn" ${canCollect ? '' : 'disabled'}>
              <i class="fas ${canCollect ? 'fa-coins' : 'fa-lock'}"></i>
              ${canCollect ? `Collect ₹${dailyIncome.toLocaleString()}` : (isExpired ? 'Completed' : 'Locked')}
            </button>
          `;

          const btn = card.querySelector('.collect-btn');
          if (canCollect) {
            btn.addEventListener('click', async () => {
              // Show confirmation modal
              const confirmed = await showConfirmation({
                title: `Collect from ${plan.planName}`,
                message: 'Are you sure you want to collect your daily earnings from this plan?',
                planName: plan.planName,
                amount: dailyIncome,
                collected: totalCollected,
                collectionCount: collectionCount,
                duration: durationDays
              });

              if (!confirmed) return;

              const originalText = btn.innerHTML;
              btn.disabled = true;
              btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;

              try {
                const userSnap = await get(userRef);
                if (!userSnap.exists()) throw new Error('User not found');
                const currentBalance = userSnap.val().balance || 0;
                const newBal = currentBalance + dailyIncome;

                const updates = {
                  balance: newBal,
                  [`investments/${id}/lastCollectionDate`]: new Date().toISOString(),
                  [`earnings/${Date.now()}`]: {
                    amount: dailyIncome,
                    date: new Date().toISOString(),
                    type: 'daily',
                    investment: id,
                    planName: plan.planName
                  }
                };

                await update(userRef, updates);
                showToast(`₹${dailyIncome.toLocaleString()} collected successfully!`, 'success');
                loadPlans(uid);
              } catch (err) {
                console.error('Collection error:', err);
                showToast('Failed to collect. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
              }
            });
          }

          container.appendChild(card);
        }
      } catch (error) {
        console.error('Error loading plans:', error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Error loading investments</p>
            <p>Please try again later</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
