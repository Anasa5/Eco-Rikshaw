<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Eco Rikshaw</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Golden Hour – body base for aura blend */
    body {
      background-color: #faf8f2;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #2d241a;
    }

    /* ─── Aura Background (fixed) ─── */
    .aura-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aura-layer-1,
    .aura-layer-2 {
      position: absolute;
      inset: 0;
      transform: translateZ(0);
      will-change: transform;
      pointer-events: none;
    }
    .aura-layer-1 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.12) 28%, rgb(255,255,255) 18%, rgb(255,138,61) 68%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(125px);
    }
    .aura-layer-2 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.22) 34%, rgb(255,255,255) 66%, rgb(255,138,61) 82%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(100px);
    }
    @media (min-width: 768px) {
      .aura-layer-1 { filter: blur(180px); }
      .aura-layer-2 { filter: blur(144px); }
    }

    /* ─── Content wrapper ─── */
    .content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    /* ─── Card ─── */
    .card {
      background: rgba(255, 252, 248, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 180, 0.35);
      box-shadow: 0 8px 32px rgba(160, 120, 80, 0.08), 0 0 0 1px rgba(255, 215, 180, 0.15) inset;
      padding: 32px 28px;
      transition: border-color 0.3s, box-shadow 0.3s;
      animation: fadeUp 0.6s ease forwards;
    }
    .card:hover {
      border-color: rgba(200, 150, 100, 0.45);
      box-shadow: 0 12px 40px rgba(160, 120, 80, 0.12), 0 0 0 1px rgba(200, 150, 100, 0.25) inset;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card .logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .card .logo svg {
      width: 48px;
      height: 48px;
      fill: #b8702a;
    }
    .card h2 {
      text-align: center;
      color: #7a4f2b;
      font-weight: 600;
      font-size: 24px;
      margin-bottom: 24px;
    }

    /* ─── Form groups ─── */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #5a4030;
      letter-spacing: 0.2px;
    }
    .input-field {
      position: relative;
    }
    .input-field input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #e2d6c8;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      background: rgba(255, 252, 248, 0.6);
      color: #2d241a;
      caret-color: #b8702a;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      outline: none;
      -webkit-appearance: none;
    }
    .input-field input::placeholder {
      color: #b8a898;
      font-weight: 400;
      font-size: 14px;
      opacity: 0.75;
    }
    .input-field input:hover {
      border-color: #cbb9a8;
      background: rgba(255, 252, 248, 0.85);
    }
    .input-field input:focus {
      border-color: #b8702a;
      background: #fffdfa;
      box-shadow: 0 0 0 4px rgba(184, 112, 42, 0.12), 0 2px 8px rgba(184, 112, 42, 0.05);
    }
    .phone-prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #7a6555;
      font-size: 15px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0.8;
    }
    .input-field:focus-within .phone-prefix {
      opacity: 1;
      color: #b8702a;
    }
    #phone {
      padding-left: 44px;
    }

    .error {
      color: #b54a3a;
      font-size: 12.5px;
      margin-top: 6px;
      display: block;
      min-height: 20px;
      font-weight: 450;
    }

    /* ─── Referral field (pre-filled, read-only) ─── */
    .referral-display {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 500;
      color: #7a4f2b;
      border: 1px dashed #b8702a;
      text-align: center;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .referral-display i {
      margin-right: 6px;
      color: #b8702a;
    }

    /* ─── Submit Button ─── */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(145deg, #d48e45, #b8702a);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s, transform 0.15s;
      box-shadow: 0 4px 16px rgba(184, 112, 42, 0.25);
      font-family: 'Poppins', sans-serif;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: linear-gradient(145deg, #d8954a, #b8702a);
      box-shadow: 0 6px 24px rgba(184, 112, 42, 0.35);
      transform: translateY(-2px);
    }
    .btn-submit:active {
      transform: scale(0.97);
    }

    /* ─── Login link ─── */
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #5a4030;
    }
    .login-link a {
      color: #b8702a;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s, text-decoration-color 0.2s;
      text-decoration: underline transparent 1.5px;
      text-underline-offset: 3px;
    }
    .login-link a:hover {
      color: #9a5f22;
      text-decoration-color: #b8702a;
    }

    /* ─── Toast ─── */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,252,248,0.95);
      backdrop-filter: blur(8px);
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
      border: 1px solid rgba(255,215,180,0.3);
      color: #2d241a;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 14px;
      z-index: 1002;
      animation: slideUp 0.35s ease forwards;
      max-width: 90%;
      text-align: center;
    }
    @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    @keyframes slideDown { from { opacity:1; transform:translateX(-50%) translateY(0); } to { opacity:0; transform:translateX(-50%) translateY(20px); } }

    /* ─── Responsive ─── */
    @media (max-width: 520px) {
      .card { padding: 24px 18px; }
      #phone { padding-left: 40px; }
    }
  </style>
</head>
<body>

  <!-- ─── AURA LAYERS ─── -->
  <div class="aura-bg" aria-hidden="true">
    <div class="aura-layer-1"></div>
    <div class="aura-layer-2"></div>
  </div>

  <!-- ─── CONTENT ─── -->
  <div class="content-wrapper">
    <div class="card">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>
      <h2>Create Account</h2>

      <form id="registerForm" autocomplete="on">
        <!-- Name -->
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required autocomplete="name" />
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="input-field">
            <span class="phone-prefix">+91</span>
            <input type="tel" id="phone" placeholder="9876543210" maxlength="10" pattern="[6-9]\d{9}" inputmode="numeric" required autocomplete="tel" />
          </div>
          <span class="error" id="phoneError"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password" />
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="Re-enter your password" required autocomplete="new-password" />
        </div>

        <!-- Referral (hidden input + display) -->
        <div class="form-group">
          <label>Referral Code</label>
          <div class="referral-display" id="referralDisplay">
            <i class="fas fa-gift"></i> <span id="referralCodeText">None</span>
          </div>
          <input type="hidden" id="referralCode" value="" />
        </div>

        <button type="submit" class="btn-submit">Register</button>
      </form>

      <div class="login-link">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <!-- ─── FIREBASE MODULE ─── -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, get, update, set } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYOEdPP3cj6RvJQtSEREtiYe42UIh1Aj8",
      authDomain: "rikshaw-67877.firebaseapp.com",
      databaseURL: "https://rikshaw-67877-default-rtdb.firebaseio.com",
      projectId: "rikshaw-67877",
      storageBucket: "rikshaw-67877.appspot.com",
      messagingSenderId: "953540778276",
      appId: "1:953540778276:web:829ca93f8f973190e0fbb1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase();
    const auth = getAuth();

    // ─── Read referral code from URL ───
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref') || '';
    const referralCodeInput = document.getElementById('referralCode');
    const referralCodeText = document.getElementById('referralCodeText');

    if (refCode) {
      referralCodeInput.value = refCode;
      referralCodeText.textContent = refCode;
    } else {
      referralCodeText.textContent = 'None (optional)';
    }

    // ─── Form validation ───
    const phoneInput = document.getElementById('phone');
    const phoneError = document.getElementById('phoneError');
    phoneInput.addEventListener('input', () => {
      const val = phoneInput.value;
      if (val.length > 0 && !/^[6-9]\d{0,9}$/.test(val)) {
        phoneError.textContent = 'Enter a valid 10-digit Indian number';
      } else if (val.length === 10 && !/^[6-9]\d{9}$/.test(val)) {
        phoneError.textContent = 'Must start with 6,7,8, or 9';
      } else {
        phoneError.textContent = '';
      }
    });

    // Password match
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    function validatePasswords() {
      if (passwordInput.value && confirmInput.value && passwordInput.value !== confirmInput.value) {
        confirmInput.setCustomValidity("Passwords don't match");
      } else {
        confirmInput.setCustomValidity("");
      }
    }
    passwordInput.addEventListener('input', validatePasswords);
    confirmInput.addEventListener('input', validatePasswords);

    // ─── Registration handler ───
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const phone = phoneInput.value.trim();
      const password = passwordInput.value;
      const confirm = confirmInput.value;
      const referral = referralCodeInput.value.trim().toUpperCase();

      // Validate
      if (!/^[6-9]\d{9}$/.test(phone)) {
        phoneError.textContent = 'Enter a valid 10-digit Indian number';
        phoneInput.focus();
        return;
      } else {
        phoneError.textContent = '';
      }

      if (!name || !password || !confirm) {
        showToast('Please fill all required fields.', 'error');
        return;
      }

      if (password !== confirm) {
        showToast('Passwords do not match!', 'error');
        confirmInput.focus();
        return;
      }

      // Disable button
      const submitBtn = document.querySelector('.btn-submit');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Registering...';

      try {
        // Create user with email (phone + @rikshaw.com)
        const email = phone + '@rikshaw.com';
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // Generate own referral code
        const myReferral = Math.random().toString(36).substring(2, 8).toUpperCase();

        // Prepare user data
        const userData = {
          name,
          phone,
          referral: myReferral,
          invitedBy: referral || '',
          balance: 0,
          profileComplete: true,
          registeredAt: Date.now()
        };

        const usersRef = ref(db, 'users');

        // Check if phone already exists
        const snap = await get(usersRef);
        if (snap.exists()) {
          const users = snap.val();
          let phoneExists = false;
          for (const key in users) {
            if (users[key].phone === phone) {
              phoneExists = true;
              break;
            }
          }
          if (phoneExists) {
            showToast('This phone number is already registered.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Register';
            return;
          }
        }

        // Save user data
        await set(ref(db, `users/${uid}`), userData);

        // If referral code provided, add to referrer's team
        if (referral) {
          const allUsersSnap = await get(usersRef);
          const allUsers = allUsersSnap.exists() ? allUsersSnap.val() : {};
          let referUid = null;
          for (const key in allUsers) {
            if (allUsers[key].referral === referral) {
              referUid = key;
              break;
            }
          }

          if (referUid) {
            // Add to referrer's team
            await set(ref(db, `team/${referUid}/${uid}`), {
              name,
              phone,
              joinedAt: Date.now(),
              invested: false,
              totalDeposit: 0,
              todayIncome: 0
            });
            // Optionally: update referrer's commission (will be calculated separately)
          } else {
            // Referral code not found – we still allow registration but without team link
            console.warn('Referral code not found:', referral);
          }
        }

        showToast('Registration successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'rikshawhome.html';
        }, 1500);

      } catch (err) {
        console.error('Registration error:', err);
        let message = 'Registration failed. Please try again.';
        if (err.code === 'auth/email-already-in-use') {
          message = 'This phone number is already registered.';
        } else if (err.code === 'auth/weak-password') {
          message = 'Password should be at least 6 characters.';
        }
        showToast(message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Register';
      }
    });

    // ─── Toast notification ───
    function showToast(message, type = 'info') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      const color = type === 'success' ? '#7a9f5a' : type === 'error' ? '#b54a3a' : '#b8702a';
      toast.innerHTML = `<i class="fas ${icon}" style="color:${color};margin-right:10px;"></i>${message}`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideDown 0.35s ease forwards';
        setTimeout(() => toast.remove(), 350);
      }, 4000);
    }

    // ─── Spinner style ───
    const style = document.createElement('style');
    style.textContent = `
      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
