<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdraw History</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #faf8f2;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      padding: 16px 16px 80px;
      color: #2d241a;
    }

    /* ─── Aura Background ─── */
    .aura-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aura-layer-1,
    .aura-layer-2 {
      position: absolute;
      inset: 0;
      transform: translateZ(0);
      will-change: transform;
      pointer-events: none;
    }
    .aura-layer-1 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.12) 28%, rgb(255,255,255) 18%, rgb(255,138,61) 68%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(125px);
    }
    .aura-layer-2 {
      background: linear-gradient(rgba(0,0,0,0) 0%, rgba(255,183,77,0.22) 34%, rgb(255,255,255) 66%, rgb(255,138,61) 82%, rgb(183,77,0) 100%);
      mix-blend-mode: multiply;
      filter: blur(100px);
    }
    @media (min-width: 768px) {
      .aura-layer-1 { filter: blur(180px); }
      .aura-layer-2 { filter: blur(144px); }
    }

    /* ─── Content Wrapper ─── */
    .content-wrapper {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ─── Header ─── */
    .header {
      background: rgba(255, 252, 248, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 180, 0.30);
      box-shadow: 0 4px 16px rgba(160, 120, 80, 0.06);
      padding: 18px 20px;
      margin-bottom: 24px;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .header:hover {
      border-color: rgba(200, 150, 100, 0.45);
      box-shadow: 0 6px 24px rgba(160, 120, 80, 0.10);
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #7a4f2b;
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 i {
      color: #b8702a;
    }

    /* ─── Record Card ─── */
    .record-card {
      background: rgba(255, 252, 248, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 16px;
      border: 1px solid rgba(255, 215, 180, 0.25);
      box-shadow: 0 4px 12px rgba(160, 120, 80, 0.06);
      padding: 18px 20px;
      margin-bottom: 14px;
      transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
      position: relative;
      overflow: hidden;
    }
    .record-card:nth-child(2) { animation-delay: 0.08s; }
    .record-card:nth-child(3) { animation-delay: 0.16s; }
    .record-card:nth-child(4) { animation-delay: 0.24s; }
    .record-card:nth-child(5) { animation-delay: 0.32s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .record-card:hover {
      transform: translateY(-4px);
      border-color: rgba(200, 150, 100, 0.45);
      box-shadow: 0 10px 30px rgba(160, 120, 80, 0.10), 0 0 0 1px rgba(200, 150, 100, 0.15) inset;
    }

    .record-card .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .record-card .status-badge.pending {
      background: rgba(255, 193, 7, 0.15);
      color: #f57f17;
    }
    .record-card .status-badge.approved {
      background: rgba(122, 159, 90, 0.15);
      color: #5f8a3a;
    }
    .record-card .status-badge.declined {
      background: rgba(181, 74, 58, 0.10);
      color: #b54a3a;
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-right: 80px;
    }
    .record-amount {
      font-size: 1.5rem;
      font-weight: 700;
      color: #b8702a;
    }
    .record-amount.withdraw {
      color: #7a4f2b;
    }

    .record-method {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(184, 112, 42, 0.10);
      color: #b8702a;
    }
    .record-method.bank {
      background: rgba(46, 125, 50, 0.10);
      color: #5f8a3a;
    }
    .record-method.upi {
      background: rgba(33, 150, 243, 0.10);
      color: #1a73e8;
    }

    .record-details {
      font-size: 0.85rem;
      color: #5a4030;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 16px;
      margin-top: 6px;
    }
    .record-details .full-width {
      grid-column: 1 / -1;
    }
    .record-details .label {
      color: #7a6555;
      font-weight: 400;
    }
    .record-details .value {
      font-weight: 500;
      color: #2d241a;
    }

    .record-details .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid rgba(200, 180, 160, 0.08);
    }
    .record-details .detail-row:last-child {
      border-bottom: none;
    }

    .record-time {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #b8a898;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ─── No Records ─── */
    .no-records {
      text-align: center;
      padding: 50px 20px;
      background: rgba(255, 252, 248, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      border: 1px solid rgba(255, 215, 180, 0.2);
      animation: fadeUp 0.5s ease forwards;
    }
    .no-records i {
      font-size: 2.5rem;
      color: #d4c8b8;
      margin-bottom: 12px;
    }
    .no-records p {
      color: #7a6555;
    }

    /* ─── Skeleton loading ─── */
    .skeleton-card {
      height: 140px;
      margin-bottom: 14px;
      background: rgba(255, 252, 248, 0.5);
      border-radius: 16px;
      border: 1px solid rgba(255, 215, 180, 0.15);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ─── Responsive ─── */
    @media (max-width: 520px) {
      .record-header {
        flex-direction: column;
        padding-right: 0;
      }
      .record-details {
        grid-template-columns: 1fr;
      }
      .record-card .status-badge {
        position: relative;
        top: auto;
        right: auto;
        align-self: flex-start;
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- ─── AURA LAYERS ─── -->
  <div class="aura-bg" aria-hidden="true">
    <div class="aura-layer-1"></div>
    <div class="aura-layer-2"></div>
  </div>

  <!-- ─── CONTENT ─── -->
  <div class="content-wrapper">

    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-receipt"></i> Withdraw History</h1>
    </div>

    <!-- Records Container -->
    <div id="recordContainer">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

  </div>

  <!-- ─── FIREBASE ─── -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, query, orderByChild, equalTo, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYOEdPP3cj6RvJQtSEREtiYe42UIh1Aj8",
      authDomain: "rikshaw-67877.firebaseapp.com",
      databaseURL: "https://rikshaw-67877-default-rtdb.firebaseio.com",
      projectId: "rikshaw-67877",
      storageBucket: "rikshaw-67877.appspot.com",
      messagingSenderId: "953540778276",
      appId: "1:953540778276:web:829ca93f8f973190e0fbb1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const container = document.getElementById('recordContainer');

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const withdrawRef = query(ref(db, 'withdrawRequests'), orderByChild('uid'), equalTo(user.uid));

      onValue(withdrawRef, (snapshot) => {
        container.innerHTML = '';

        if (!snapshot.exists()) {
          container.innerHTML = `
            <div class="no-records">
              <i class="fas fa-inbox"></i>
              <p>You have no withdrawal requests yet.</p>
            </div>
          `;
          return;
        }

        const requests = [];
        snapshot.forEach(child => {
          const req = child.val();
          requests.push({ id: child.key, ...req });
        });

        // Sort newest first
        requests.sort((a, b) => (b.time || 0) - (a.time || 0));

        requests.forEach((req, index) => {
          const card = document.createElement('div');
          card.className = 'record-card';
          card.style.animationDelay = `${index * 0.07}s`;

          const status = req.status || 'pending';
          const statusClass = status === 'pending' ? 'pending'
                            : status === 'approved' ? 'approved'
                            : 'declined';

          const method = req.method || 'unknown';
          const isBank = method === 'bank';
          const methodIcon = isBank ? 'fa-university' : 'fa-mobile-alt';
          const methodClass = isBank ? 'bank' : 'upi';
          const methodLabel = isBank ? 'Bank Transfer' : 'UPI Transfer';

          // Build method details
          let methodDetailsHTML = '';
          if (isBank && req.bank) {
            methodDetailsHTML = `
              <div class="detail-row"><span class="label">Account Number</span> <span class="value">${req.bank.accountNumber || 'N/A'}</span></div>
              <div class="detail-row"><span class="label">IFSC Code</span> <span class="value">${req.bank.ifsc || 'N/A'}</span></div>
              <div class="detail-row"><span class="label">Account Holder</span> <span class="value">${req.bank.accountHolder || 'N/A'}</span></div>
            `;
          } else if (!isBank && req.upi) {
            methodDetailsHTML = `
              <div class="detail-row"><span class="label">UPI ID</span> <span class="value">${req.upi.upiId || 'N/A'}</span></div>
              <div class="detail-row"><span class="label">UPI Name</span> <span class="value">${req.upi.name || 'N/A'}</span></div>
            `;
          } else {
            // Fallback: try to find upi or bank from old data
            const upiId = req.upi || req.upiId || 'N/A';
            const bankAcc = req.bankAccount || req.accountNumber || 'N/A';
            if (upiId !== 'N/A') {
              methodDetailsHTML = `
                <div class="detail-row"><span class="label">UPI ID</span> <span class="value">${upiId}</span></div>
                ${req.upiName ? `<div class="detail-row"><span class="label">UPI Name</span> <span class="value">${req.upiName}</span></div>` : ''}
              `;
            } else if (bankAcc !== 'N/A') {
              methodDetailsHTML = `
                <div class="detail-row"><span class="label">Account Number</span> <span class="value">${bankAcc}</span></div>
                ${req.ifsc ? `<div class="detail-row"><span class="label">IFSC</span> <span class="value">${req.ifsc}</span></div>` : ''}
                ${req.accountHolder ? `<div class="detail-row"><span class="label">Account Holder</span> <span class="value">${req.accountHolder}</span></div>` : ''}
              `;
            } else {
              methodDetailsHTML = `<div class="detail-row"><span class="label">Method Details</span> <span class="value">N/A</span></div>`;
            }
          }

          // Format time
          let timeStr = 'N/A';
          if (req.time) {
            try {
              const date = new Date(req.time);
              timeStr = date.toLocaleString();
            } catch {
              timeStr = req.time;
            }
          }

          card.innerHTML = `
            <span class="status-badge ${statusClass}">${status}</span>
            <div class="record-header">
              <div class="record-amount withdraw">₹${req.amount}</div>
              <span class="record-method ${methodClass}"><i class="fas ${methodIcon}"></i> ${methodLabel}</span>
            </div>
            <div class="record-details">
              <div class="full-width">
                ${methodDetailsHTML}
              </div>
            </div>
            <div class="record-time">
              <i class="far fa-clock"></i> ${timeStr}
            </div>
          `;

          container.appendChild(card);
        });
      });
    });
  </script>
</body>
</html>
